<script>
async function processAndGenerate() {
  const site = document.getElementById('site').value;
  const title = document.getElementById('title').value;
  const url = document.getElementById('url').value;
  const fileInput = document.getElementById('fileInput');
  const status = document.getElementById('status');
  const resultContainer = document.getElementById('resultContainer');
  const resultLink = document.getElementById('resultLink');

  if (!fileInput.files[0] || !url) {
    alert("Harap pilih foto dan masukkan Link Affiliate!");
    return;
  }

  status.innerText = "Mengunggah gambar...";

  try {
    const formData = new FormData();
    formData.append('reqtype', 'fileupload');
    formData.append('fileToUpload', fileInput.files[0]);

    // Mengunggah ke API internal Vercel (/api/upload)
    const response = await fetch('/api/upload', {
      method: 'POST',
      body: formData
    });

    const rawImgUrl = await response.text();

    if (rawImgUrl && rawImgUrl.startsWith('http')) {
      const finalLink = `${window.location.origin}/go?site=${encodeURIComponent(site)}&title=${encodeURIComponent(title)}&img=${encodeURIComponent(rawImgUrl)}&url=${encodeURIComponent(url)}`;

      status.innerText = "Berhasil!";
      resultContainer.style.display = 'block';
      resultLink.value = finalLink;
    } else {
      status.innerText = "Gagal mengunggah gambar. Pastikan ukuran file di bawah 5MB.";
    }
  } catch (err) {
    console.error(err);
    status.innerText = "Terjadi kesalahan koneksi saat upload.";
  }
}
</script>
